name: Release Check

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run test suite
        run: npm test -- --run

      - name: Run packaged CLI entry smoke
        run: npm run test:e2e:cli:entry

      - name: Run packaged CLI E2E
        run: npm run test:e2e:cli

      - name: Check release readiness
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          BASE_SHA=""

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
          fi

          PACKAGE_JSON_CHANGED="false"
          PREVIOUS_VERSION=""
          MATCHING_RELEASE_TAG="false"

          if [[ -n "${BASE_SHA}" ]] && [[ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            if git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" | grep -qx "package.json"; then
              PACKAGE_JSON_CHANGED="true"
            fi

            if git cat-file -e "${BASE_SHA}:package.json" 2>/dev/null; then
              PREVIOUS_VERSION="$(git show "${BASE_SHA}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            fi
          fi

          git fetch --force --quiet origin "refs/tags/v${CURRENT_VERSION}:refs/tags/v${CURRENT_VERSION}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/v${CURRENT_VERSION}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "v${CURRENT_VERSION}")"
            if [[ "${TAG_COMMIT}" == "${GITHUB_SHA}" ]]; then
              MATCHING_RELEASE_TAG="true"
            fi
          fi

          VERSION_EXISTS="false"
          if npm view "${PACKAGE_NAME}@${CURRENT_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            VERSION_EXISTS="true"
          fi

          {
            echo "## Release Check"
            echo ""
            echo "- package: \`${PACKAGE_NAME}\`"
            echo "- current version: \`${CURRENT_VERSION}\`"
            echo "- previous version: \`${PREVIOUS_VERSION:-unknown}\`"
            echo "- package.json changed: \`${PACKAGE_JSON_CHANGED}\`"
            echo "- matching release tag: \`${MATCHING_RELEASE_TAG}\`"
            echo "- version already on npm: \`${VERSION_EXISTS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${PACKAGE_JSON_CHANGED}" == "true" ]] && [[ -n "${PREVIOUS_VERSION}" ]] && [[ "${PREVIOUS_VERSION}" == "${CURRENT_VERSION}" ]]; then
            echo "package.json changed, but version is still ${CURRENT_VERSION}. Bump the version before release." >&2
            exit 1
          fi

          if [[ "${PACKAGE_JSON_CHANGED}" == "true" ]] && [[ "${VERSION_EXISTS}" == "true" ]] && [[ "${MATCHING_RELEASE_TAG}" != "true" ]]; then
            echo "Version ${CURRENT_VERSION} is already published on npm. Choose a new version before release." >&2
            exit 1
          fi

          if [[ "${VERSION_EXISTS}" == "true" ]] && [[ "${MATCHING_RELEASE_TAG}" == "true" ]]; then
            echo "Version ${CURRENT_VERSION} already exists on npm and this commit is tagged v${CURRENT_VERSION}; treating it as a completed release commit."
          elif [[ "${VERSION_EXISTS}" == "true" ]]; then
            echo "Version ${CURRENT_VERSION} already exists on npm, but no package.json version change was detected in this range."
          else
            echo "Version ${CURRENT_VERSION} is available for a future release."
          fi
