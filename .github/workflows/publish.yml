name: Publish Package

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build package
        run: npm run build

      - name: Verify package version against tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG=""
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Package version: ${VERSION}"
          if [[ -n "${TAG}" ]]; then
            echo "Release tag: ${TAG}"
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "Tag ${TAG} does not match package.json version v${VERSION}" >&2
              exit 1
            fi
          fi

      - name: Verify publish tarball
        run: npm pack --dry-run

      - name: Check whether version already exists on npm
        id: npm_version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published on npm."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not published yet."
          fi

      - name: Publish to npm
        if: steps.npm_version.outputs.already_published != 'true'
        shell: bash
        run: |
          set -o pipefail
          if ! npm publish --access public --provenance 2>&1 | tee publish.log; then
            DETAILS="$(tail -n 50 publish.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=npm publish failed::${DETAILS}"
            exit 1
          fi

      - name: Summarize publish result
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${{ steps.npm_version.outputs.already_published }}" == "true" ]]; then
            echo "Skipped publish because version ${VERSION} already exists on npm."
          else
            echo "Published version ${VERSION} to npm."
          fi
